<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML without styles</title>
    <style>
        body {
            background-color: #000;
            color: aliceblue;
            margin: 20px 20px;
        }

        nav {
            text-align: center;
            text-decoration: none;
            color: rgb(190, 222, 250);
        }

        nav a {
            color: rgb(190, 222, 250);
            text-decoration: none;
            margin: 0 20px;

        }

        h2 {
            color: rgb(64, 64, 160);
            text-align: center;
        }

        p {
            font-size: 18px;
        }

        ul,
        li {
            color: rgb(190, 222, 250);
        }

        footer {
            color: #ffffff;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>

<body>
    <header>
        <h2>My first HLML document</h2>
        <nav>
            <a href="#">Home</a> |
            <a href="#">About</a> |
            <a href="#">Contact</a> |
            <a href="#">Blog</a> |
        </nav>
    </header>
    <main>
        <section>
            <h2>Welcome to My Website</h2>
            <p>This is a simple HTML page without any styles.</p>
        </section>
        <article>
            <h3>Article Title</h3>
            <p><strong>This is an article section</strong> where you can add more content.</p>
        </article>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </main>
    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>
</body>

</html>
