<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML without styles</title>
</head>

<body>
    <header>
        <h2 style="color: blue; text-align: center;">My first HLML document</h2>
        <nav>
            <a href="#">Home</a> |
            <a href="#">About</a> |
            <a href="#">Contact</a> |
            <a href="#">Blog</a> |
        </nav>
    </header>
    <main>
        <section>
            <h2>Welcome to My Website</h2>
            <p style="font-size: 18px; color: #000; background-color: beige;">This is a simple HTML page without any
                styles.</p>
        </section>
        <article>
            <h3>Article Title</h3>
            <p><strong>This is an article section</strong> where you can add more content.</p>
        </article>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </main>
    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>
</body>

</html>
